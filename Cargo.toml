[package]
name = "MacWindowResizer"
version = "0.1.0"
edition = "2024"
description = "Event-driven macOS window sizing with compile-time embedded rules"
default-run = "MacWindowResizer"

[[bin]]
name = "MacWindowResizer"
path = "src/main.rs"

[[bin]]
name = "task"
path = "src/task.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSRunningApplication", "NSScreen", "NSWorkspace", "libc"] }
objc2-application-services = { version = "0.3", default-features = false, features = ["std", "HIServices", "AXError", "AXUIElement", "AXValue", "libc", "objc2-core-graphics"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes", "CFArray", "CFDictionary", "CFRunLoop", "CFString", "CFNumber"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSDictionary", "NSNotification", "NSDate", "NSRunLoop", "NSTimer", "NSOperation", "NSString", "NSThread", "block2"] }
